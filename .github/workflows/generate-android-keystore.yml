name: Generate Android signing keystore

# Seeds / validates the self-signed Android release certificate used by the
# Release workflow. The keystore is kept in the private Actions cache and is
# never uploaded as a downloadable artifact or printed to the log.
#
# Run this once after enabling Actions, or to inspect the current certificate
# fingerprint. The Release workflow also auto-generates the keystore if the
# cache is missing, so this workflow is optional.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustvnc-android-keystore
  cancel-in-progress: false

jobs:
  keystore:
    name: Generate or validate self-signed keystore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Android signing keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: android/keystore/release.p12
          key: rustvnc-android-keystore-v1

      - name: Generate or validate certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
        run: bash .github/scripts/ensure-android-keystore.sh

      - name: Explain how the keystore is stored
        if: always()
        run: |
          {
            echo "### Keystore handling"
            echo
            echo "- Cache hit: \`${{ steps.keystore-cache.outputs.cache-hit || 'false' }}\`"
            echo "- The keystore stays in the private Actions cache (\`rustvnc-android-keystore-v1\`)."
            echo "- It is **not** committed, uploaded as an artifact, or printed."
            echo "- The SHA-256 fingerprint above is public and is included in release notes."
            echo
            echo "To pin a durable production key, generate a keystore locally, add"
            echo "\`ANDROID_KEYSTORE_BASE64\` and \`ANDROID_KEYSTORE_PASSWORD\` (plus"
            echo "\`ANDROID_KEY_ALIAS\`/\`ANDROID_KEY_PASSWORD\`) as repository secrets,"
            echo "then re-run this workflow. See \`docs/RELEASING.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
