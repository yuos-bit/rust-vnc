[workspace]
resolver = "3"
members = [
    "crates/rv-core",
    "crates/rv-proto",
    "crates/rv-net",
    "crates/rv-capture",
    "crates/rv-input",
    "crates/rv-engine",
    "crates/rv-server",
    "apps/pc",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://example.invalid/rust-vnc"
rust-version = "1.99"

[workspace.dependencies]
rv-core = { path = "crates/rv-core" }
rv-proto = { path = "crates/rv-proto" }
rv-net = { path = "crates/rv-net" }
rv-capture = { path = "crates/rv-capture" }
rv-input = { path = "crates/rv-input" }
rv-engine = { path = "crates/rv-engine" }

anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
